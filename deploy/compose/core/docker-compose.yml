services:

  # ================================================================
  # KAFKA
  # ================================================================
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    ports:
      - "${CORE_KAFKA_EXTERNAL_PORT}:${CORE_KAFKA_EXTERNAL_PORT}"
    env_file:
      - ../../env/.env
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:${CORE_KAFKA_CONTROLLER_PORT}"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${CORE_KAFKA_INTERNAL_PORT},PLAINTEXT_EXTERNAL://0.0.0.0:${CORE_KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${CORE_KAFKA_CONTROLLER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${CORE_KAFKA_INTERNAL_PORT},PLAINTEXT_EXTERNAL://localhost:${CORE_KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${CORE_KAFKA_CONTROLLER_PORT}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/${CORE_KAFKA_INTERNAL_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - microservices-net

  # ================================================================
  # KAFKA UI
  # ================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "${CORE_KAFKA_UI_PORT}:8080"
    env_file:
      - ../../env/.env
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:${CORE_KAFKA_INTERNAL_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - microservices-net

  # ================================================================
  # OPENTELEMETRY COLLECTOR
  # ================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "${CORE_OTEL_GRPC_PORT}:4317"
      - "${CORE_OTEL_HTTP_PORT}:4318"
      - "${CORE_OTEL_METRICS_PORT}:8888"
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:${CORE_OTEL_METRICS_PORT}/metrics"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net

  # ================================================================
  # JAEGER
  # ================================================================
  jaeger:
    image: jaegertracing/jaeger:2.6.0
    container_name: jaeger
    ports:
      - "${CORE_JAEGER_UI_PORT}:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger/data
      - jaeger_key:/badger/key
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:${CORE_JAEGER_UI_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - microservices-net

  # ================================================================
  # PROMETHEUS
  # ================================================================
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    ports:
      - "${CORE_PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices-net

  # ================================================================
  # GRAFANA
  # ================================================================
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "${CORE_GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${CORE_GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${CORE_GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices-net

  # ================================================================
  # ELASTICSEARCH
  # ================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${CORE_ELASTICSEARCH_VERSION}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${CORE_ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?local=true"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - microservices-net

  # ================================================================
  # KIBANA
  # ================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:${CORE_ELASTICSEARCH_VERSION}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${CORE_KIBANA_PORT}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - microservices-net

# ================================================================
# VOLUMES
# ================================================================
volumes:
  kafka_data:
  jaeger_data:
  jaeger_key:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

# ================================================================
# NETWORKS
# ================================================================
networks:
  microservices-net:
    name: microservices-net
    external: false